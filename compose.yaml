x-app-env: &app-env
  DATABASE_URL: postgresql://${DB_USER:-url_checker}:${DB_PASSWORD:-url_checker}@postgres:5432/${DB_NAME:-url_checker}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine3.24
    container_name: bulk-url-checker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-url_checker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-url_checker}
      POSTGRES_DB: ${DB_NAME:-url_checker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:8.8.2-alpine3.23
    container_name: bulk-url-checker-redis
    restart: unless-stopped
    # AOF persistence: queued jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: bulk-url-checker-app
    scale: ${API_REPLICAS:-1}
    command: ["node", "apps/api/dist/server.js"]
    environment:
      <<: *app-env
      API_PORT: ${API_PORT:-3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-3001}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-lb:
    image: docker.io/library/nginx:1.29-alpine
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
      API_PORT: ${API_PORT:-3001}
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: bulk-url-checker-app
    scale: ${WORKER_REPLICAS:-1}
    command: ["node", "apps/worker/dist/index.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Lets in-flight checks finish on shutdown.
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    image: bulk-url-checker-app
    command: ["pnpm", "--filter", "@bulk-url-checker/web", "start"]
    environment:
      # Server-side calls go through the load balancer on the compose network...
      API_URL: http://api-lb:${API_PORT:-3001}
      # ...while the browser (SSE) reaches it via the published port. Set it
      # alongside API_PORT (.env.example derives it); podman-compose can't
      # nest ${API_PORT} inside this default.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    depends_on:
      api-lb:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
